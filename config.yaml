# Configuração do research workspace.
# Consumido por scripts/config.py — ver CLAUDE.md para o significado de cada guardrail.

# G5 — máximo de papers processados por execução.
max_papers_per_run: 30

# Polite pool das APIs (Crossref, OpenAlex, Unpaywall).
# Enviado no User-Agent/mailto para obter rate limits melhores.
polite_pool_email: gpcmoura@gmail.com

# G6 — idioma padrão dos resumos. Português apenas quando o paper original for em pt.
default_summary_language: en

# G7 — idiomas aceitos na busca e no download. Papers em outros idiomas são
# descartados dos candidatos (o usuário lê apenas estes).
accepted_languages:
  - en
  - pt

# Convenção de renomeação: truncamento do título no nome do arquivo.
title_max_chars: 80

# Crossref
crossref:
  base_url: https://api.crossref.org
  timeout_seconds: 30
  max_retries: 3
  # Similaridade mínima (0-1) entre o título do PDF e o título retornado pela busca
  # sem DOI. Abaixo disso a correspondência é rejeitada e a entrada vira INCOMPLETE (G1).
  title_match_threshold: 0.85

# OpenAlex — busca principal de candidatos.
openalex:
  base_url: https://api.openalex.org
  timeout_seconds: 30
  max_retries: 3
  # Quantos resultados buscar por string antes de deduplicar e cortar em G5.
  results_per_query: 50
  # Chave da API (gratuita, em openalex.org): orçamento diário próprio de 10.000
  # créditos, em vez do gratuito sem chave (~1.000, dividido por IP; uma busca custa 10).
  # A chave fica FORA do Git, neste arquivo; a variável OPENALEX_API_KEY tem precedência.
  api_key_file: credentials/openalex/api_key.txt

# Google Docs — conta de serviço do modo revisão de manuscrito (scripts/gdocs_apply.py).
# Aqui fica só o CAMINHO; o JSON da chave fica FORA do Git, em credentials/.
# --credentials e GOOGLE_APPLICATION_CREDENTIALS têm precedência sobre este arquivo.
google_docs:
  service_account_file: "credentials/manuscripts/paper smip/drive/api/research-workspace-511213-8177bb6a1c3e.json"
  # Cliente OAuth "Desktop app" para a troca de figuras (scripts/gdocs_figures.py, escopo
  # drive.file). O token fica ao lado, em google-drive-token.json (também fora do Git).
  oauth_client_file: "credentials/manuscripts/paper smip/drive/google cloud auth /client_secret_353622544220-tjukaa2sosa2cbmlun2h605in40qvlsj.apps.googleusercontent.com.json"

# Unpaywall — fallback para localizar PDF open access quando o OpenAlex não traz.
unpaywall:
  base_url: https://api.unpaywall.org/v2
  timeout_seconds: 30

# Download de PDFs open access.
download:
  timeout_seconds: 120
  # Pausa entre downloads, para não sobrecarregar os servidores de origem.
  delay_between_seconds: 1.5
  max_size_mb: 80
