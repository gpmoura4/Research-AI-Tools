[project]
name = "research-workspace"
version = "0.1.0"
description = "Ferramenta de pesquisa acadêmica operada via Claude Code"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "bibtexparser>=1.4,<2.0",
    "langdetect>=1.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
gdocs = [
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
]

[tool.uv]
default-groups = ["dev", "gdocs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
